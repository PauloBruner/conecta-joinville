<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ponto de Apoio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">Ponto de Apoio</div>

<div class="container">
    <h2>Criar conta</h2>

    <form id="form-register" class="form-box">
        <input id="nome" placeholder="Nome" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="senha" type="password" placeholder="Senha" required minlength="6">
        <button class="btn" type="submit">Cadastrar</button>
        <p id="erro" class="msg-erro"></p>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("form-register").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
        const cred = await auth.createUserWithEmailAndPassword(email, senha);
        await cred.user.updateProfile({ displayName: nome });
        await db.collection("perfis").doc(cred.user.uid).set({
            nome: nome,
            email: email,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
        });
        window.location.href = "dashboard.html";
    } catch (erro) {
        exibirErro("erro", erro);
    }
});
</script>

</body>
</html>
