<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar — Ponto de Apoio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0B4A43">
</head>
<body>

<div class="header-bar">
    <div class="header-inner">
        <a class="header-brand" href="index.html">Ponto de Apoio</a>
    </div>
</div>

<div class="container">
    <div class="card card-form">
        <h2>Criar conta</h2>
        <p class="muted" style="margin-bottom:20px;">Leva menos de um minuto.</p>

        <form id="form-register">
            <div class="field">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>
            </div>
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required minlength="6">
            </div>

            <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
            <p id="erro" class="error-text"></p>
        </form>

        <p class="muted text-center mt-24" style="font-size:14px;">
            Já tem conta? <a href="login.html">Entrar</a>
        </p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("form-register").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
        const cred = await auth.createUserWithEmailAndPassword(email, senha);
        await cred.user.updateProfile({ displayName: nome });
        await db.collection("perfis").doc(cred.user.uid).set({
            nome: nome,
            email: email,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
        });
        window.location.href = "dashboard.html";
    } catch (erro) {
        exibirErro("erro", erro);
    }
});
</script>

</body>
</html>
