<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ponto de Apoio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <span>Ponto de Apoio</span>
    <button id="btn-logout" class="logout">Sair</button>
</div>

<div class="container">
    <h2>Cadastro de Voluntário</h2>

    <form id="form-voluntario" class="form-box">
        <input id="nome" placeholder="Seu nome" required>
        <input id="email" type="email" placeholder="Seu email" required>
        <input id="habilidade" placeholder="Ex: motorista, enfermeiro" required>
        <button class="btn" type="submit">Cadastrar</button>
        <p id="erro" class="msg-erro"></p>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
let usuarioAtual = null;
configurarLogout("btn-logout");
exigirLogin((user, perfil) => {
    usuarioAtual = user;
    if (perfil && perfil.nome) document.getElementById("nome").value = perfil.nome;
    if (user.email) document.getElementById("email").value = user.email;
});

document.getElementById("form-voluntario").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const habilidade = document.getElementById("habilidade").value;

    try {
        await db.collection("voluntarios").doc(usuarioAtual.uid).set({
            nome: nome,
            email: email,
            habilidade: habilidade,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
        });
        window.location.href = "dashboard.html";
    } catch (erro) {
        console.error(erro);
        document.getElementById("erro").textContent = "Não foi possível salvar. Tente novamente.";
    }
});
</script>

</body>
</html>
