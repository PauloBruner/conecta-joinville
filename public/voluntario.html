<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voluntário — Ponto de Apoio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-bar">
    <div class="header-inner">
        <a class="header-brand" href="dashboard.html">Ponto de Apoio</a>
        <nav class="header-nav">
            <a href="dashboard.html">Painel</a>
            <a href="nova_necessidade.html">Nova necessidade</a>
            <a href="voluntario.html">Voluntário</a>
            <a href="ongs.html">Participantes</a>
            <button id="btn-logout" class="sair">Sair</button>
        </nav>
    </div>
</div>

<div class="container">
    <div class="card card-form">
        <h2>Cadastro de voluntário</h2>
        <p class="muted" style="margin-bottom:20px;">Conte como você pode ajudar.</p>

        <form id="form-voluntario">
            <div class="field">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>
            </div>
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Seu email" required>
            </div>
            <div class="field">
                <label for="habilidade">Habilidade</label>
                <input type="text" id="habilidade" placeholder="Ex: reforço escolar, culinária, manutenção" required>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Quero ser voluntário</button>
            <p id="erro" class="error-text"></p>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
let usuarioAtual = null;
configurarLogout("btn-logout");
exigirLogin((user, perfil) => {
    usuarioAtual = user;
    if (perfil && perfil.nome) document.getElementById("nome").value = perfil.nome;
    if (user.email) document.getElementById("email").value = user.email;
});

document.getElementById("form-voluntario").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const habilidade = document.getElementById("habilidade").value;

    try {
        await db.collection("voluntarios").doc(usuarioAtual.uid).set({
            nome: nome,
            email: email,
            habilidade: habilidade,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
        });
        window.location.href = "dashboard.html";
    } catch (erro) {
        console.error(erro);
        document.getElementById("erro").textContent = "Não foi possível salvar. Tente novamente.";
    }
});
</script>

</body>
</html>
