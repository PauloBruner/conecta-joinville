<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova necessidade — Ponto de Apoio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-bar">
    <div class="header-inner">
        <a class="header-brand" href="dashboard.html">Ponto de Apoio</a>
        <nav class="header-nav">
            <a href="dashboard.html">Painel</a>
            <a href="nova_necessidade.html">Nova necessidade</a>
            <a href="voluntario.html">Voluntário</a>
            <a href="ongs.html">Participantes</a>
            <button id="btn-logout" class="sair">Sair</button>
        </nav>
    </div>
</div>

<div class="container">
    <div class="card card-form" style="max-width:520px;">
        <h2>Cadastrar necessidade</h2>
        <p class="muted" style="margin-bottom:20px;">Descreva o que a comunidade precisa.</p>

        <form id="form-nova">
            <div class="field">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" placeholder="Ex: Doação de agasalhos" required>
            </div>
            <div class="field">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" rows="4" placeholder="Explique com detalhes o que é necessário" required></textarea>
            </div>
            <div class="field">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" placeholder="Ex: Floresta" required>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Cadastrar</button>
            <p id="erro" class="error-text"></p>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
let usuarioAtual = null;
configurarLogout("btn-logout");
exigirLogin((user) => { usuarioAtual = user; });

document.getElementById("form-nova").addEventListener("submit", async (e) => {
    e.preventDefault();
    const titulo = document.getElementById("titulo").value;
    const descricao = document.getElementById("descricao").value;
    const bairro = document.getElementById("bairro").value;

    try {
        await db.collection("necessidades").add({
            titulo: titulo,
            descricao: descricao,
            bairro: bairro,
            criadoPor: usuarioAtual.uid,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
        });
        window.location.href = "dashboard.html";
    } catch (erro) {
        console.error(erro);
        document.getElementById("erro").textContent = "Não foi possível salvar. Tente novamente.";
    }
});
</script>

</body>
</html>
