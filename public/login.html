<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Ponto de Apoio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-bar">
    <div class="header-inner">
        <a class="header-brand" href="index.html">Ponto de Apoio</a>
    </div>
</div>

<div class="container">
    <div class="card card-form">
        <h2>Entrar</h2>
        <p class="muted" style="margin-bottom:20px;">Acesse sua conta para ver e ajudar com necessidades da comunidade.</p>

        <form id="form-login">
            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Entrar</button>
            <p id="erro" class="error-text"></p>
        </form>

        <p class="muted text-center mt-24" style="font-size:14px;">
            Ainda não tem conta? <a href="register.html">Cadastre-se</a>
        </p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
        await auth.signInWithEmailAndPassword(email, senha);
        window.location.href = "dashboard.html";
    } catch (erro) {
        exibirErro("erro", erro);
    }
});
</script>

</body>
</html>
