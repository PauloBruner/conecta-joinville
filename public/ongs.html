<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ponto de Apoio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <span>Ponto de Apoio</span>
    <button id="btn-logout" class="logout">Sair</button>
</div>

<div class="container">
    <h2>ONGs / Usuários cadastrados</h2>
    <ul id="lista-usuarios" class="lista-simples">
        <li class="msg-vazio">Carregando...</li>
    </ul>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
configurarLogout("btn-logout");
exigirLogin(async () => {
    const lista = document.getElementById("lista-usuarios");
    try {
        const snap = await db.collection("perfis").get();
        if (snap.empty) {
            lista.innerHTML = '<li class="msg-vazio">Nenhum usuário cadastrado ainda.</li>';
            return;
        }
        lista.innerHTML = "";
        snap.forEach((doc) => {
            const li = document.createElement("li");
            li.textContent = doc.data().nome || "(sem nome)";
            lista.appendChild(li);
        });
    } catch (erro) {
        console.error(erro);
        lista.innerHTML = '<li class="msg-erro">Não foi possível carregar a lista.</li>';
    }
});
</script>

</body>
</html>
